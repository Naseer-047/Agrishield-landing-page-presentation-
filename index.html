<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriShield Presentation</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">AgriShield</div>
        <!-- Google Drive direct download link -->
        <a href="https://drive.google.com/uc?export=download&id=1fBbXK7Ez7Uo-PgAcE1tHAGE2Jc8riH74" class="btn download-btn">Download App</a>
    </nav>

    <main class="content-wrapper">
        <section class="video-section">
            <h1 class="main-title">Watch the Demo</h1>
            <div class="video-container">
                <video controls preload="metadata">
                    <source src="videos/presentation videeo.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </section>

        <section class="gallery-section">
            <h2 class="section-title">App Screenshots</h2>
            <div class="gallery-grid">
                <img src="app images/img_1.jpg" alt="App Screenshot 1" class="gallery-img">
                <img src="app images/img_2.jpg" alt="App Screenshot 2" class="gallery-img">
                <img src="app images/img_3.jpg" alt="App Screenshot 3" class="gallery-img">
                <img src="app images/img_4.jpg" alt="App Screenshot 4" class="gallery-img">
                <img src="app images/img_5.jpg" alt="App Screenshot 5" class="gallery-img">
                <img src="app images/img_6.jpg" alt="App Screenshot 6" class="gallery-img">
                <img src="app images/screen.jpg" alt="App Screenshot 7" class="gallery-img">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AgriShield.</p>
    </footer>
</body>
</html>
